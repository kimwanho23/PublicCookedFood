name: public-cooked-food

x-app-environment: &app-environment
  DB_URL: jdbc:mysql://mysql:3306/food?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true
  DB_USERNAME: ${MYSQL_APP_USER:-app}
  DB_PASSWORD: ${MYSQL_APP_PASSWORD:-app1234}
  SESSION_STORE_TYPE: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-docker-google-client}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-docker-google-secret}
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-docker-naver-client}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-docker-naver-secret}
  SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SESSION_COOKIE_SECURE: "false"
  FILE_DIR: /data/storage/

services:
  mysql:
    image: mysql:8.0
    container_name: publiccookedfood-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food}
      MYSQL_USER: ${MYSQL_APP_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-app1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: publiccookedfood-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: publiccookedfood-nginx
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    image: public-cooked-food-app:local
    container_name: publiccookedfood-app1
    environment:
      <<: *app-environment
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - app-storage:/data/storage
    restart: unless-stopped

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    image: public-cooked-food-app:local
    container_name: publiccookedfood-app2
    environment:
      <<: *app-environment
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - app-storage:/data/storage
    restart: unless-stopped

volumes:
  redis-data:
  mysql-data:
  app-storage:
