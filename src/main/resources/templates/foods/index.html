<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/header :: headResources('레시피 목록')}">
    <meta charset="UTF-8">
    <title>레시피 목록</title>
</head>
<body class="app-shell d-flex flex-column">
<header th:replace="~{fragments/header :: siteHeader}"></header>

<main class="page-shell">
    <div class="container" id="featured-3">
        <section class="hero-panel hero-panel-recipe mb-4">
            <div class="d-flex flex-column flex-xl-row justify-content-between gap-3">
                <div>
                    <h1 class="display-title h3 mb-2">오늘 뭐 먹지? 레시피 탐색</h1>
                    <p class="mb-0 text-white-50">국가, 분류, 재료 기준으로 공공 레시피를 큐레이션해서 보여드립니다.</p>
                </div>
                <div class="d-flex align-items-end gap-3 flex-wrap">
                    <div>
                        <p class="hero-number mb-0" th:text="${infoResponseDto != null ? infoResponseDto.getTotalElements() : 0}">0</p>
                        <p class="hero-label mb-0">recipes found</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="section-wrap recipe-filter-panel mb-3">
            <div class="recipe-filter-top mb-3">
                <div>
                    <h2 class="h6 mb-1">필터 및 검색</h2>
                    <p class="text-muted-soft mb-0">여러 필터를 동시에 선택한 뒤 한 번에 적용할 수 있습니다.</p>
                </div>
                <a class="btn btn-sm btn-soft" th:href="@{/recipes}">전체 초기화</a>
            </div>

            <form th:action="@{/recipes}" method="get" class="recipe-filter-form">
                <input type="hidden" name="keyword" th:if="${selectedKeyword != null and !#strings.isEmpty(selectedKeyword)}" th:value="${selectedKeyword}">

                <div class="recipe-top-search mb-3">
                    <label for="recipeSearchInput" class="visually-hidden">레시피명 검색</label>
                    <input type="text" id="recipeSearchInput" name="search" th:value="${selectedSearch}" placeholder="레시피명 검색" class="form-control" aria-label="레시피명 검색">
                    <button type="submit" class="btn btn-brand">검색</button>
                </div>

                <div class="mb-3">
                    <p class="filter-label mb-2">현재 적용 필터</p>
                    <div class="d-flex flex-wrap">
                        <span class="chip-muted"
                              th:if="${(selectedTypes == null or #lists.isEmpty(selectedTypes))
                                   and (selectedNations == null or #lists.isEmpty(selectedNations))
                                   and (selectedIngredients == null or #lists.isEmpty(selectedIngredients))
                                   and (selectedSearch == null or #strings.isEmpty(selectedSearch))}">
                            적용된 필터가 없습니다.
                        </span>
                        <button type="button"
                                class="filter-chip is-active filter-chip-remove"
                                th:each="typeItem : ${selectedTypes}"
                                data-filter-name="type"
                                th:attr="data-filter-value=${typeItem}">
                            <span th:text="|유형 ${typeItem}|">유형</span>
                            <span class="filter-chip-x" aria-hidden="true">x</span>
                        </button>
                        <button type="button"
                                class="filter-chip is-active filter-chip-remove"
                                th:each="nationItem : ${selectedNations}"
                                data-filter-name="nation"
                                th:attr="data-filter-value=${nationItem}">
                            <span th:text="|국가 ${nationItem}|">국가</span>
                            <span class="filter-chip-x" aria-hidden="true">x</span>
                        </button>
                        <button type="button"
                                class="filter-chip is-active filter-chip-remove"
                                th:each="ingredientItem : ${selectedIngredients}"
                                data-filter-name="ingredient"
                                th:attr="data-filter-value=${ingredientItem}">
                            <span th:text="|재료 ${ingredientItem}|">재료</span>
                            <span class="filter-chip-x" aria-hidden="true">x</span>
                        </button>
                        <button type="button"
                                class="filter-chip is-active filter-chip-remove"
                                th:if="${selectedSearch != null and !#strings.isEmpty(selectedSearch)}"
                                data-filter-name="search">
                            <span th:text="|검색 ${selectedSearch}|">검색</span>
                            <span class="filter-chip-x" aria-hidden="true">x</span>
                        </button>
                    </div>
                </div>

                <div class="recipe-category-grid mb-3">
                    <article class="category-block" th:each="category : ${categories}">
                        <div class="category-header d-flex align-items-center justify-content-between">
                            <p class="filter-label mb-0" th:text="${category.title}">카테고리</p>
                            <span class="category-count" th:text="|${#lists.size(category.items)}개|">0개</span>
                        </div>
                        <div class="filter-options">
                            <label class="filter-option" th:each="item : ${category.items}">
                                <input type="checkbox"
                                       class="filter-checkbox"
                                       th:name="${category.param}"
                                       th:value="${item}"
                                       th:checked="${(category.param == 'type' and selectedTypes != null and #lists.contains(selectedTypes, item))
                                                or (category.param == 'nation' and selectedNations != null and #lists.contains(selectedNations, item))
                                                or (category.param == 'ingredient' and selectedIngredients != null and #lists.contains(selectedIngredients, item))}">
                                <span th:text="${item}">항목</span>
                            </label>
                        </div>
                    </article>
                </div>
            </form>
        </section>

        <section id="recipeResults" th:fragment="recipeResults" class="recipe-results-shell">
            <div th:if="${queryErrorMsg != null}" class="alert alert-warning" th:text="${queryErrorMsg}"></div>

            <div class="section-wrap p-4">
                <div class="results-toolbar mb-3">
                    <div>
                        <h2 class="h5 mb-1">레시피 결과</h2>
                        <span class="small text-muted-soft" th:if="${infoResponseDto != null}" th:text="|총 ${infoResponseDto.getTotalElements()}건|">총 0건</span>
                    </div>
                </div>

                <div class="alert alert-light border" th:if="${infoResponseDto == null or infoResponseDto.getTotalElements() == 0}">
                    조건에 맞는 레시피가 없습니다. 필터를 바꾸거나 검색어를 지워보세요.
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-xxl-3 g-4 recipe-grid" th:if="${infoResponseDto != null and infoResponseDto.getTotalElements() > 0}">
                    <div class="col" th:each="list : ${infoResponseDto}">
                        <article class="recipe-card recipe-card-clickable"
                                 th:attr="data-recipe-url=@{/recipes/{id}(id=${list.getRecipeID()})}">
                            <a th:href="@{/recipes/{id}(id=${list.getRecipeID()})}" class="recipe-card-link">
                                <div class="recipe-thumb-link">
                                    <img th:src="@{${list.imgURL}}" alt="음식 이미지" class="recipe-thumb">
                                </div>
                                <div class="p-3">
                                    <p class="recipe-kicker" th:text="${list.getTyNM() != null and !#strings.isEmpty(list.getTyNM()) ? list.getTyNM() : 'Recipe'}">타입</p>
                                    <p class="recipe-title" th:text="${list.getRecipeNMKO()}">요리 제목</p>
                                    <p class="recipe-summary" th:text="${list.getSumry() != null and !#strings.isEmpty(list.getSumry()) ? list.getSumry() : '요약 정보가 없습니다.'}">요리 소개</p>
                                    <div class="recipe-meta d-flex flex-wrap gap-2">
                                        <span class="meta-pill" th:text="${list.getNationNM() != null and !#strings.isEmpty(list.getNationNM()) ? list.getNationNM() : '미분류'}">국가</span>
                                        <span class="meta-pill" th:text="${list.getCalorie() != null and !#strings.isEmpty(list.getCalorie()) ? list.getCalorie() : '칼로리 정보 없음'}">칼로리</span>
                                    </div>
                                </div>
                            </a>
                        </article>
                    </div>
                </div>
            </div>

            <div th:if="${infoResponseDto != null and infoResponseDto.getTotalElements() > 0}" class="section-wrap p-3 mt-3">
                <div th:replace="~{fragments/paginationFragment :: pagination('/recipes', ${startPage}, ${endPage}, ${currentPage}, ${totalPages}, ${hasPreviousGroup}, ${hasNextGroup}, ${selectedKeyword}, ${selectedSearch}, ${null}, ${null}, ${selectedTypes}, ${selectedNations}, ${selectedIngredients})}"></div>
            </div>
        </section>

        <script>
            (function () {
                const pageRoot = document.getElementById('featured-3');
                if (!pageRoot || !window.fetch || !window.history || !window.DOMParser) {
                    return;
                }

                const resultsSelector = '#recipeResults';
                const filterSelector = '.recipe-filter-panel';
                const heroCountSelector = '.hero-number';
                const filterChangeDebounceMs = 180;
                let pendingController = null;
                let filterChangeTimer = null;

                function isRecipesListUrl(url) {
                    return /^\/recipes\/?$/.test(url.pathname);
                }

                function normalizeQueryParams(url) {
                    const normalized = new URL(url.toString(), window.location.origin);
                    const params = new URLSearchParams(normalized.search);
                    for (const [key, value] of Array.from(params.entries())) {
                        if (typeof value === 'string' && value.trim() === '') {
                            params.delete(key);
                        }
                    }
                    normalized.search = params.toString();
                    return normalized;
                }

                function replaceSection(doc, selector) {
                    const nextElement = doc.querySelector(selector);
                    const currentElement = document.querySelector(selector);
                    if (!nextElement || !currentElement) {
                        return false;
                    }
                    currentElement.replaceWith(nextElement);
                    return true;
                }

                function swapRecipeResults(html) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const replacedResults = replaceSection(doc, resultsSelector);
                    if (!replacedResults) {
                        return false;
                    }
                    replaceSection(doc, filterSelector);

                    const nextHeroCount = doc.querySelector(heroCountSelector);
                    const currentHeroCount = document.querySelector(heroCountSelector);
                    if (nextHeroCount && currentHeroCount) {
                        currentHeroCount.textContent = nextHeroCount.textContent;
                    }
                    return true;
                }

                function fetchRecipeResults(url, pushState) {
                    if (pendingController) {
                        pendingController.abort();
                    }
                    pendingController = new AbortController();
                    pageRoot.setAttribute('aria-busy', 'true');

                    fetch(url, {
                        method: 'GET',
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                            'Accept': 'text/html'
                        },
                        signal: pendingController.signal
                    })
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error('Failed to load recipe results');
                            }
                            return response.text();
                        })
                        .then((html) => {
                            const replaced = swapRecipeResults(html);
                            if (!replaced) {
                                window.location.href = url;
                                return;
                            }
                            if (pushState) {
                                window.history.pushState({foodsAjax: true}, '', url);
                            }
                        })
                        .catch((error) => {
                            if (error && error.name === 'AbortError') {
                                return;
                            }
                            window.location.href = url;
                        })
                        .finally(() => {
                            pageRoot.removeAttribute('aria-busy');
                            pendingController = null;
                        });
                }

                function submitFilterForm(filterForm) {
                    if (!(filterForm instanceof HTMLFormElement)) {
                        return;
                    }
                    if (filterChangeTimer) {
                        window.clearTimeout(filterChangeTimer);
                        filterChangeTimer = null;
                    }
                    if (typeof filterForm.requestSubmit === 'function') {
                        filterForm.requestSubmit();
                        return;
                    }
                    const submitEvent = new Event('submit', {bubbles: true, cancelable: true});
                    if (filterForm.dispatchEvent(submitEvent)) {
                        filterForm.submit();
                    }
                }

                document.addEventListener('click', function (event) {
                    const recipeCard = event.target.closest('.recipe-card-clickable[data-recipe-url]');
                    if (recipeCard) {
                        if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                            return;
                        }
                        if (event.target.closest('a, button, input, select, textarea, label')) {
                            return;
                        }
                        const targetUrl = recipeCard.getAttribute('data-recipe-url');
                        if (!targetUrl) {
                            return;
                        }
                        event.preventDefault();
                        window.location.href = targetUrl;
                        return;
                    }

                    const removeButton = event.target.closest('.filter-chip-remove');
                    if (removeButton) {
                        const filterForm = removeButton.closest('form.recipe-filter-form');
                        if (!(filterForm instanceof HTMLFormElement)) {
                            return;
                        }
                        const filterName = removeButton.getAttribute('data-filter-name');
                        const filterValue = removeButton.getAttribute('data-filter-value');

                        if (filterName === 'search') {
                            const searchInput = filterForm.querySelector('input[name="search"]');
                            if (searchInput instanceof HTMLInputElement) {
                                searchInput.value = '';
                            }
                        } else if (filterName) {
                            const checkboxes = filterForm.querySelectorAll('input[type="checkbox"]');
                            for (const checkbox of checkboxes) {
                                if (!(checkbox instanceof HTMLInputElement)) {
                                    continue;
                                }
                                if (checkbox.name === filterName && checkbox.value === (filterValue || '')) {
                                    checkbox.checked = false;
                                    break;
                                }
                            }
                        }

                        event.preventDefault();
                        submitFilterForm(filterForm);
                        return;
                    }

                    const link = event.target.closest('a[href]');
                    const currentResults = document.querySelector(resultsSelector);
                    const currentFilters = document.querySelector(filterSelector);
                    const inAjaxScope = !!(link && (
                        (currentResults && currentResults.contains(link))
                        || (currentFilters && currentFilters.contains(link))
                    ));
                    if (!inAjaxScope) {
                        return;
                    }
                    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                        return;
                    }
                    if (link.target && link.target !== '_self') {
                        return;
                    }

                    const url = new URL(link.href, window.location.origin);
                    if (!isRecipesListUrl(url)) {
                        return;
                    }

                    event.preventDefault();
                    const normalizedUrl = normalizeQueryParams(url);
                    fetchRecipeResults(normalizedUrl.toString(), true);
                });

                document.addEventListener('submit', function (event) {
                    const form = event.target;
                    const currentResults = document.querySelector(resultsSelector);
                    const currentFilters = document.querySelector(filterSelector);
                    const inAjaxScope = !!(form instanceof HTMLFormElement && (
                        (currentResults && currentResults.contains(form))
                        || (currentFilters && currentFilters.contains(form))
                    ));
                    if (!inAjaxScope) {
                        return;
                    }

                    const method = (form.getAttribute('method') || 'get').toLowerCase();
                    if (method !== 'get') {
                        return;
                    }

                    const action = form.getAttribute('action') || window.location.pathname;
                    const url = new URL(action, window.location.origin);
                    if (!isRecipesListUrl(url)) {
                        return;
                    }

                    event.preventDefault();
                    const params = new URLSearchParams(new FormData(form));
                    url.search = params.toString();
                    const normalizedUrl = normalizeQueryParams(url);
                    fetchRecipeResults(normalizedUrl.toString(), true);
                });

                document.addEventListener('keydown', function (event) {
                    const recipeCard = event.target.closest('.recipe-card-clickable[data-recipe-url]');
                    if (!recipeCard) {
                        return;
                    }
                    if (event.key !== 'Enter' && event.key !== ' ') {
                        return;
                    }
                    if (event.target.closest('a, button, input, select, textarea, label')) {
                        return;
                    }
                    const targetUrl = recipeCard.getAttribute('data-recipe-url');
                    if (!targetUrl) {
                        return;
                    }
                    event.preventDefault();
                    window.location.href = targetUrl;
                });

                window.addEventListener('popstate', function () {
                    const currentUrl = new URL(window.location.href);
                    if (!isRecipesListUrl(currentUrl)) {
                        return;
                    }
                    const normalizedUrl = normalizeQueryParams(currentUrl);
                    fetchRecipeResults(normalizedUrl.toString(), false);
                });

                document.addEventListener('change', function (event) {
                    const target = event.target;
                    if (!(target instanceof HTMLInputElement) || target.type !== 'checkbox') {
                        return;
                    }
                    const filterForm = target.closest('form.recipe-filter-form');
                    if (!(filterForm instanceof HTMLFormElement)) {
                        return;
                    }
                    if (filterChangeTimer) {
                        window.clearTimeout(filterChangeTimer);
                    }
                    filterChangeTimer = window.setTimeout(function () {
                        filterChangeTimer = null;
                        submitFilterForm(filterForm);
                    }, filterChangeDebounceMs);
                });

            })();
        </script>
    </div>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
