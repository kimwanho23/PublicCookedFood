<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/header :: headResources('로그인')}">
    <meta charset="UTF-8">
    <title>로그인</title>
</head>
<body class="app-shell">
<main class="auth-shell">
    <section class="auth-card">
        <a class="text-decoration-none" th:href="@{/recipes}">
            <span class="auth-logo">P</span>
        </a>

        <h1 class="h4 mb-1">로그인</h1>
        <p class="text-muted-soft mb-4">계정으로 로그인하고 북마크와 게시판 기능을 이용하세요.</p>

        <form action="/u/login" th:action="@{/u/login}" th:object="${loginDto}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                <p class="mb-1" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
            </div>
            <div th:if="${loginErrorMsg != null}" class="alert alert-danger py-2" th:text="${loginErrorMsg}"></div>

            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="text" id="email" class="form-control" th:field="*{email}" placeholder="이메일" th:errorclass="field-error">
                <div class="field-error" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-control" th:field="*{password}" placeholder="비밀번호" th:errorclass="field-error">
                <div class="field-error" th:errors="*{password}"></div>
            </div>

            <button class="btn btn-brand w-100" type="submit">로그인</button>
        </form>

        <div class="auth-divider">또는</div>

        <div class="d-flex gap-2 mb-3">
            <a class="btn btn-outline-secondary flex-fill" th:href="@{/u/signup}">회원가입</a>
            <a class="btn btn-soft flex-fill" th:href="@{/u/account/recover}">계정 찾기</a>
        </div>

        <div class="auth-divider">소셜 로그인</div>

        <div class="d-flex justify-content-center gap-3">
            <a class="social-circle text-decoration-none"
               id="kakao-login-btn"
               href="#"
               aria-label="카카오 로그인 (준비중)"
               title="카카오 로그인 (준비중)">
                <img th:src="@{../img/btn_kakao.svg}" alt="카카오 로그인" style="width: 28px; height: 28px;">
            </a>

            <a class="social-circle text-decoration-none"
               id="google-login-btn"
               th:href="@{/oauth2/authorization/google}"
               aria-label="구글 로그인"
               title="구글 로그인">
                <img th:src="@{../img/btn_google.svg}" alt="구글 로그인" style="width: 28px; height: 28px;">
            </a>

            <a class="social-circle text-decoration-none"
               id="naver-login-btn"
               th:href="@{/oauth2/authorization/naver}"
               aria-label="네이버 로그인"
               title="네이버 로그인">
                <img th:src="@{../img/btn_naver.svg}" alt="네이버 로그인" style="width: 28px; height: 28px;">
            </a>
        </div>
    </section>
</main>
</body>
</html>
