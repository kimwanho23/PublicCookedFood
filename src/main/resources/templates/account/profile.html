<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/header :: headResources('프로필 수정')}">
    <meta charset="UTF-8">
    <title>프로필 수정</title>
</head>
<body class="app-shell d-flex flex-column">
<header th:replace="~{fragments/header :: siteHeader}"></header>

<main class="page-shell">
    <div class="container" style="max-width: 760px;">
        <section class="hero-panel mb-4">
            <h1 class="h4 mb-2">프로필 수정</h1>
            <p class="mb-0 text-white-50">개인 정보와 프로필 이미지를 수정합니다.</p>
        </section>

        <section class="section-wrap p-3 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="text-muted-soft">환경설정과 작성글은 별도 화면에서 관리할 수 있습니다.</span>
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-soft btn-sm" th:href="@{/u/settings}">환경설정</a>
                <a class="btn btn-soft btn-sm" th:href="@{/u/{accountId}(accountId=${account.id})}">내 프로필</a>
            </div>
        </section>

        <section class="section-wrap p-4">
            <form action="/u/profile" th:action="@{/u/profile}" th:object="${accountUpdateDto}" method="post">
                <input type="hidden" name="_method" value="put">

                <div th:if="${errorMessage != null}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

                <div class="mb-4">
                    <label class="form-label d-block">프로필 이미지</label>
                    <div class="d-flex align-items-center gap-3 flex-wrap">
                        <img id="profileImagePreview"
                             class="profile-image-preview"
                             th:src="${accountUpdateDto.profileImageUrl != null and !#strings.isEmpty(accountUpdateDto.profileImageUrl) ? accountUpdateDto.profileImageUrl : '/img/person-black.svg'}"
                             data-default-src="/img/person-black.svg"
                             onerror="this.onerror=null;this.src='/img/person-black.svg';"
                             alt="프로필 이미지 미리보기">
                        <div class="d-flex gap-2 flex-wrap">
                            <label for="profileImageFile" class="btn btn-soft mb-0">이미지 업로드</label>
                            <input type="file" id="profileImageFile" class="d-none" accept="image/*">
                            <button type="button" id="removeProfileImageButton" class="btn btn-outline-secondary">기본 이미지로 변경</button>
                        </div>
                    </div>
                    <input type="hidden" id="profileImageUrl" th:field="*{profileImageUrl}">
                    <p class="small text-muted-soft mt-2 mb-0">정사각형 형태로 댓글 프로필에 표시됩니다.</p>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="text" id="email" th:field="*{email}" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">닉네임</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" th:errorclass="field-error">
                    <div class="field-error" th:errors="*{name}"></div>
                    <p class="small text-muted-soft mt-2 mb-0">닉네임은 2~20자의 한글, 영문, 숫자, _, -만 사용할 수 있으며 다른 사용자와 중복될 수 없습니다.</p>
                </div>

                <div class="mb-3">
                    <label for="phoneNumber" class="form-label">전화번호</label>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" placeholder="010-0000-0000">
                </div>

                <div class="mb-3">
                    <label for="birthDate" class="form-label">생년월일</label>
                    <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="gender" class="form-label">성별</label>
                    <select id="gender" th:field="*{gender}" class="form-select">
                        <option value="">선택하세요</option>
                        <option value="MALE">남성</option>
                        <option value="FEMALE">여성</option>
                        <option value="OTHER">기타</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">주소</label>
                    <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="주소">
                </div>

                <div class="mb-4">
                    <label for="addressDetail" class="form-label">상세 주소</label>
                    <input type="text" id="addressDetail" th:field="*{addressDetail}" class="form-control" placeholder="상세 주소">
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/recipes}">취소</a>
                    <button type="submit" class="btn btn-brand">수정하기</button>
                </div>
            </form>
        </section>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.getElementById('profileImageFile');
        const preview = document.getElementById('profileImagePreview');
        const hiddenInput = document.getElementById('profileImageUrl');
        const removeButton = document.getElementById('removeProfileImageButton');
        const defaultSrc = preview ? preview.getAttribute('data-default-src') : '';
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || '';
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content') || '';

        function makeHeaders(includeCsrf) {
            const headers = {
                'X-Requested-With': 'XMLHttpRequest'
            };
            if (includeCsrf && csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }
            return headers;
        }

        if (fileInput && preview && hiddenInput) {
            function applyPreview(url) {
                const nextUrl = (url || '').trim();
                preview.src = nextUrl || defaultSrc;
                hiddenInput.value = nextUrl;
            }

            if (removeButton) {
                removeButton.addEventListener('click', function () {
                    applyPreview('');
                });
            }

            fileInput.addEventListener('change', async function () {
                const file = fileInput.files && fileInput.files[0];
                if (!file) {
                    return;
                }
                if (!file.type || !file.type.startsWith('image/')) {
                    window.alert('이미지 파일만 업로드할 수 있습니다.');
                    fileInput.value = '';
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                fileInput.disabled = true;
                try {
                    const response = await fetch('/api/images', {
                        method: 'POST',
                        headers: makeHeaders(true),
                        body: formData
                    });
                    if (!response.ok) {
                        throw new Error('upload_failed');
                    }
                    const imageUrl = (await response.text()).trim();
                    if (!imageUrl) {
                        throw new Error('empty_url');
                    }
                    applyPreview(imageUrl);
                    console.info('[Profile] profile image uploaded:', imageUrl);
                } catch (error) {
                    console.error('[Profile] profile image upload failed', error);
                    window.alert('프로필 이미지 업로드에 실패했습니다.');
                } finally {
                    fileInput.disabled = false;
                    fileInput.value = '';
                }
            });
        }
    });
</script>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
