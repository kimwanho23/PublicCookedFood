<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/header :: headResources('회원가입')}">
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body class="app-shell">
<main class="auth-shell">
    <section class="auth-card">
        <a class="text-decoration-none" th:href="@{/recipes}">
            <span class="auth-logo">P</span>
        </a>

        <h1 class="h4 mb-1">회원가입</h1>
        <p class="text-muted-soft mb-4">기본 계정 정보를 입력하고 바로 시작하세요.</p>

        <form action="/u/signup" th:action="@{/u/signup}" th:object="${accountSaveDto}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger py-2">
                <p class="mb-1" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
            </div>
            <div th:if="${errorMessage != null}" class="alert alert-danger py-2" th:text="${errorMessage}"></div>

            <div class="mb-3">
                <label for="email" class="form-label">이메일</label>
                <input type="text" id="email" th:field="*{email}" class="form-control" placeholder="이메일" th:errorclass="field-error">
                <div class="field-error" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="비밀번호" th:errorclass="field-error">
                <div class="field-error" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label for="myName" class="form-label">닉네임</label>
                <input type="text" id="myName" th:field="*{name}" class="form-control" placeholder="별명" th:errorclass="field-error">
                <div class="field-error" th:errors="*{name}"></div>
                <p class="small text-muted-soft mt-2 mb-0">닉네임은 2~20자의 한글, 영문, 숫자, _, -만 사용할 수 있으며 다른 사용자와 중복될 수 없습니다.</p>
            </div>

            <div class="mb-3">
                <label for="phoneNumber" class="form-label">전화번호</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" placeholder="010-0000-0000" th:errorclass="field-error">
                <div class="field-error" th:errors="*{phoneNumber}"></div>
            </div>

            <div class="mb-3">
                <label for="birthDate" class="form-label">생년월일</label>
                <input type="date" id="birthDate" th:field="*{birthDate}" class="form-control" th:errorclass="field-error">
                <div class="field-error" th:errors="*{birthDate}"></div>
            </div>

            <div class="mb-3">
                <label for="gender" class="form-label">성별</label>
                <select id="gender" th:field="*{gender}" class="form-select" th:errorclass="field-error">
                    <option value="">선택하세요</option>
                    <option value="MALE">남성</option>
                    <option value="FEMALE">여성</option>
                    <option value="OTHER">기타</option>
                </select>
                <div class="field-error" th:errors="*{gender}"></div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">주소</label>
                <input type="text" id="address" th:field="*{address}" class="form-control" placeholder="주소 (선택)">
            </div>

            <div class="mb-4">
                <label for="addressDetail" class="form-label">상세 주소</label>
                <input type="text" id="addressDetail" th:field="*{addressDetail}" class="form-control" placeholder="상세 주소 (선택)">
            </div>

            <input type="hidden" th:field="*{profileImageUrl}">

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-brand">가입하기</button>
                <a class="btn btn-outline-secondary" th:href="@{/u/login}">로그인으로 돌아가기</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
