<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/header :: headResources(${formTitle != null ? formTitle : '사용자 레시피 작성'})}">
    <meta charset="UTF-8">
    <title th:text="${formTitle != null ? formTitle : '사용자 레시피 작성'}">사용자 레시피 작성</title>
</head>
<body class="app-shell d-flex flex-column">
<header th:replace="~{fragments/header :: siteHeader}"></header>

<main class="page-shell">
    <div class="container" style="max-width: 1120px;">
        <section class="hero-panel mb-4">
            <h1 class="h3 mb-2" th:text="${formTitle != null ? formTitle : '사용자 레시피 작성'}">사용자 레시피 작성</h1>
            <p class="mb-0 text-white-50"
               th:text="${formIntro != null ? formIntro : '대표 이미지, 재료, 조리 단계를 구조화해서 등록합니다. 조리 단계는 최대 15단계까지 작성할 수 있습니다.'}">
                대표 이미지, 재료, 조리 단계를 구조화해서 등록합니다. 조리 단계는 최대 15단계까지 작성할 수 있습니다.
            </p>
        </section>

        <div th:if="${recipeErrorMessage != null}" class="alert alert-danger py-2 mb-3" th:text="${recipeErrorMessage}">등록 오류</div>

        <form th:action="${formAction != null ? formAction : '/user-recipes'}" th:object="${recipeForm}" method="post" data-user-recipe-form>
            <input th:if="${formMode == 'edit'}" type="hidden" name="_method" value="patch">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger mb-3">
                <p class="mb-1" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
            </div>
            <section class="section-wrap p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                    <div>
                        <h2 class="h5 mb-1">기본 정보</h2>
                        <p class="text-muted-soft mb-0">제목, 소개, 대표 이미지를 먼저 입력합니다.</p>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12">
                        <label for="recipeTitle" class="form-label">레시피 제목</label>
                        <input id="recipeTitle" type="text" th:field="*{title}" class="form-control" placeholder="예: 바삭한 삼겹살 김치볶음">
                        <div class="field-error" th:errors="*{title}"></div>
                    </div>

                    <div class="col-12">
                        <label for="recipeSummary" class="form-label">레시피 소개</label>
                        <textarea id="recipeSummary" th:field="*{summary}" class="form-control" rows="3"
                                  placeholder="레시피의 특징이나 팁을 간단히 적어주세요."></textarea>
                        <div class="field-error" th:errors="*{summary}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">대표 이미지</label>
                        <div class="surface-soft p-3 js-user-recipe-image-field">
                            <input type="hidden" th:field="*{thumbnailUrl}" class="js-user-recipe-image-url">
                            <div class="d-flex flex-column flex-md-row gap-3 align-items-start">
                                <img class="img-fluid rounded-3 border js-user-recipe-image-preview"
                                     alt="대표 이미지 미리보기"
                                     style="max-width: 240px; display: none;">
                                <div class="flex-grow-1">
                                    <input type="file"
                                           class="form-control js-user-recipe-image-input"
                                           accept="image/*"
                                           aria-label="대표 이미지 업로드">
                                    <div class="form-text mt-2">이미지를 업로드하면 자동으로 리사이징되어 저장됩니다.</div>
                                    <div class="small text-muted mt-2 js-user-recipe-image-status" aria-live="polite"></div>
                                    <button type="button"
                                            class="btn btn-outline-secondary btn-symbol btn-sm mt-3 js-user-recipe-image-clear"
                                            aria-label="대표 이미지 초기화"
                                            title="대표 이미지 초기화">×</button>
                                </div>
                            </div>
                        </div>
                        <div class="field-error" th:errors="*{thumbnailUrl}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="recipeCookingTime" class="form-label">조리 시간</label>
                        <input id="recipeCookingTime" type="text" th:field="*{cookingTime}" class="form-control" placeholder="예: 25분">
                        <div class="field-error" th:errors="*{cookingTime}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="recipeServings" class="form-label">인분</label>
                        <input id="recipeServings" type="text" th:field="*{servings}" class="form-control" placeholder="예: 2인분">
                        <div class="field-error" th:errors="*{servings}"></div>
                    </div>

                    <div class="col-md-4">
                        <label for="recipeDifficulty" class="form-label">난이도</label>
                        <select id="recipeDifficulty" th:field="*{difficulty}" class="form-select">
                            <option value="">선택하세요</option>
                            <option th:each="difficulty : ${difficultyOptions}" th:value="${difficulty}" th:text="${difficulty}">초급</option>
                        </select>
                        <div class="field-error" th:errors="*{difficulty}"></div>
                    </div>
                </div>
            </section>

            <section class="section-wrap p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                    <div>
                        <h2 class="h5 mb-1">재료</h2>
                        <p class="text-muted-soft mb-0">주재료, 부재료, 양념으로 나눠서 재료와 용량을 입력합니다.</p>
                    </div>
                    <button type="button"
                            class="btn btn-soft btn-symbol btn-sm"
                            data-user-recipe-add="ingredient"
                            aria-label="재료 추가"
                            title="재료 추가">+</button>
                </div>

                <div id="ingredientRows" class="d-flex flex-column gap-3">
                    <div class="surface-soft p-3 user-recipe-ingredient-row" th:each="ingredient, stat : *{ingredients}">
                        <div class="row g-3 align-items-start">
                            <div class="col-md-3">
                                <label class="form-label" th:for="|ingredient-group-${stat.index}|">구분</label>
                                <select class="form-select"
                                        th:id="|ingredient-group-${stat.index}|"
                                        th:field="*{ingredients[__${stat.index}__].ingredientGroup}"
                                        data-field-name="ingredientGroup">
                                    <option value="">선택</option>
                                    <option th:each="group : ${ingredientGroups}" th:value="${group.name()}" th:text="${group.displayName}">주재료</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" th:for="|ingredient-name-${stat.index}|">재료명</label>
                                <input type="text"
                                       class="form-control"
                                       th:id="|ingredient-name-${stat.index}|"
                                       th:field="*{ingredients[__${stat.index}__].ingredientName}"
                                       data-field-name="ingredientName"
                                       placeholder="예: 삼겹살">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" th:for="|ingredient-amount-${stat.index}|">용량</label>
                                <input type="text"
                                       class="form-control"
                                       th:id="|ingredient-amount-${stat.index}|"
                                       th:field="*{ingredients[__${stat.index}__].amountText}"
                                       data-field-name="amountText"
                                       placeholder="예: 250g">
                            </div>
                            <div class="col-md-1 d-grid">
                                <label class="form-label d-none d-md-block">&nbsp;</label>
                                <button type="button"
                                        class="btn btn-outline-secondary btn-symbol"
                                        data-user-recipe-remove="ingredient"
                                        aria-label="재료 삭제"
                                        title="재료 삭제">−</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="field-error" th:errors="*{ingredients}"></div>
            </section>

            <section class="section-wrap p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                    <div>
                        <h2 class="h5 mb-1">조리 단계</h2>
                        <p class="text-muted-soft mb-0">순서대로 설명과 이미지를 등록합니다. 단계 이미지는 1장씩 업로드할 수 있습니다.</p>
                    </div>
                </div>

                <div id="stepRows" class="d-flex flex-column gap-3">
                    <div class="surface-soft p-3 user-recipe-step-row" th:each="step, stat : *{steps}">
                        <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                            <h3 class="h6 mb-0 user-recipe-step-label" th:text="|단계 ${stat.index + 1}|">단계 1</h3>
                            <button type="button"
                                    class="btn btn-outline-secondary btn-symbol btn-sm"
                                    data-user-recipe-remove="step"
                                    aria-label="단계 삭제"
                                    title="단계 삭제">−</button>
                        </div>

                        <input type="hidden"
                               th:field="*{steps[__${stat.index}__].stepNo}"
                               data-field-name="stepNo"
                               th:value="${stat.index + 1}">

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label" th:for="|step-contents-${stat.index}|">설명</label>
                                <textarea class="form-control"
                                          rows="4"
                                          th:id="|step-contents-${stat.index}|"
                                          th:field="*{steps[__${stat.index}__].contents}"
                                          data-field-name="contents"
                                          placeholder="예: 달군 팬에 삼겹살을 앞뒤로 노릇하게 굽습니다."></textarea>
                            </div>
                            <div class="col-12">
                                <label class="form-label" th:for="|step-tip-${stat.index}|">팁</label>
                                <input type="text"
                                       class="form-control"
                                       th:id="|step-tip-${stat.index}|"
                                       th:field="*{steps[__${stat.index}__].tip}"
                                       data-field-name="tip"
                                       placeholder="예: 중불로 익히면 기름이 너무 빨리 타지 않습니다.">
                            </div>
                            <div class="col-12">
                                <label class="form-label">단계 이미지</label>
                                <div class="surface-soft p-3 js-user-recipe-image-field">
                                    <input type="hidden"
                                           th:field="*{steps[__${stat.index}__].imageUrl}"
                                           data-field-name="imageUrl"
                                           class="js-user-recipe-image-url">
                                    <div class="d-flex flex-column flex-md-row gap-3 align-items-start">
                                        <img class="img-fluid rounded-3 border js-user-recipe-image-preview"
                                             alt="단계 이미지 미리보기"
                                             style="max-width: 220px; display: none;">
                                        <div class="flex-grow-1">
                                            <input type="file"
                                                   class="form-control js-user-recipe-image-input"
                                                   accept="image/*"
                                                   aria-label="단계 이미지 업로드">
                                            <div class="small text-muted mt-2 js-user-recipe-image-status" aria-live="polite"></div>
                                            <button type="button"
                                                    class="btn btn-outline-secondary btn-symbol btn-sm mt-3 js-user-recipe-image-clear"
                                                    aria-label="단계 이미지 초기화"
                                                    title="단계 이미지 초기화">×</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="button"
                            class="btn btn-soft btn-symbol-wide w-100"
                            data-user-recipe-add="step"
                            aria-label="다음 단계 추가"
                            title="다음 단계 추가">+</button>
                </div>
                <div class="field-error" th:errors="*{steps}"></div>
            </section>

            <div class="d-flex justify-content-end gap-2 pb-4">
                <a class="btn btn-outline-secondary" th:href="@{/user-recipes}">취소</a>
                <button type="submit" class="btn btn-brand" th:text="${formSubmitLabel != null ? formSubmitLabel : '레시피 등록'}">레시피 등록</button>
            </div>
        </form>

        <template id="ingredientRowTemplate">
            <div class="surface-soft p-3 user-recipe-ingredient-row">
                <div class="row g-3 align-items-start">
                    <div class="col-md-3">
                        <label class="form-label">구분</label>
                        <select class="form-select" data-field-name="ingredientGroup">
                            <option value="">선택</option>
                            <option th:each="group : ${ingredientGroups}" th:value="${group.name()}" th:text="${group.displayName}">주재료</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">재료명</label>
                        <input type="text" class="form-control" data-field-name="ingredientName" placeholder="예: 삼겹살">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">용량</label>
                        <input type="text" class="form-control" data-field-name="amountText" placeholder="예: 250g">
                    </div>
                    <div class="col-md-1 d-grid">
                        <label class="form-label d-none d-md-block">&nbsp;</label>
                        <button type="button"
                                class="btn btn-outline-secondary btn-symbol"
                                data-user-recipe-remove="ingredient"
                                aria-label="재료 삭제"
                                title="재료 삭제">−</button>
                    </div>
                </div>
            </div>
        </template>

        <template id="stepRowTemplate">
            <div class="surface-soft p-3 user-recipe-step-row">
                <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                    <h3 class="h6 mb-0 user-recipe-step-label">단계 1</h3>
                    <button type="button"
                            class="btn btn-outline-secondary btn-symbol btn-sm"
                            data-user-recipe-remove="step"
                            aria-label="단계 삭제"
                            title="단계 삭제">−</button>
                </div>
                <input type="hidden" data-field-name="stepNo">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">설명</label>
                        <textarea class="form-control" rows="4" data-field-name="contents" placeholder="예: 재료를 준비하고 팬을 예열합니다."></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">팁</label>
                        <input type="text" class="form-control" data-field-name="tip" placeholder="예: 중약불에서 천천히 익히면 더 좋아요.">
                    </div>
                    <div class="col-12">
                        <label class="form-label">단계 이미지</label>
                        <div class="surface-soft p-3 js-user-recipe-image-field">
                            <input type="hidden" data-field-name="imageUrl" class="js-user-recipe-image-url">
                            <div class="d-flex flex-column flex-md-row gap-3 align-items-start">
                                <img class="img-fluid rounded-3 border js-user-recipe-image-preview"
                                     alt="단계 이미지 미리보기"
                                     style="max-width: 220px; display: none;">
                                <div class="flex-grow-1">
                                    <input type="file"
                                           class="form-control js-user-recipe-image-input"
                                           accept="image/*"
                                           aria-label="단계 이미지 업로드">
                                    <div class="small text-muted mt-2 js-user-recipe-image-status" aria-live="polite"></div>
                                            <button type="button"
                                                    class="btn btn-outline-secondary btn-symbol btn-sm mt-3 js-user-recipe-image-clear"
                                                    aria-label="단계 이미지 초기화"
                                                    title="단계 이미지 초기화">×</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
<script th:src="@{/js/user-recipe-form.js}"></script>
</body>
</html>
