<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
</head>

<body>
<div th:insert="~{fragments/header}"></div>

<div class="container">
<form th:action="@{/boards}" th:object="${boardDto}" style="padding: 70px;" method="post">

    <div th:if="${#fields.hasGlobalErrors()}">
        <p class="field-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
    </div>

    <div class="form-floating form-group mb-4">
        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="제목" th:errorclass="field-error">
        <label for="title">제목</label>
        <div class="field-error" th:errors="*{title}"></div>
    </div>

    <div class="form-floating form-group mb-4">
        <select id="sectionId" th:field="*{sectionId}" class="form-select" th:errorclass="field-error">
            <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">게시판 탭</option>
        </select>
        <label for="sectionId">게시판 탭</label>
        <div class="field-error" th:errors="*{sectionId}"></div>
    </div>

    <div class="mb-4">
        <textarea style="height: 500px" id="summernote" th:field="*{contents}" class="form-control" th:errorclass="field-error" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        <label for="summernote"></label>
        <div class="field-error" th:errors="*{contents}"></div>
    </div>

    <script>
        $('#summernote').summernote({
            placeholder: 'Hello stand alone ui',
            tabsize: 3,
            height: 800,
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'underline', 'clear']],
                ['color', ['color']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link', 'picture', 'video']],
                ['view', ['fullscreen', 'codeview', 'help']]
            ],
            callbacks: {
                onPaste: function(e) {
                    e.preventDefault();

                    // Clipboard API 사용
                    navigator.clipboard.readText().then(function(text) {
                        // 현재 선택 영역에 텍스트를 삽입
                        var selection = window.getSelection();
                        if (!selection.rangeCount) return;

                        selection.deleteFromDocument(); // 기존의 내용을 삭제
                        selection.getRangeAt(0).insertNode(document.createTextNode(text));

                        // 커서를 텍스트의 끝으로 이동
                        selection.collapseToEnd();
                    }).catch(function(err) {
                        console.error('Failed to read clipboard contents: ', err);
                    });
                },
                onImageUpload: function(files) {
                    for (var i = 0; i < files.length; i++) {
                        uploadFile(files[i], this); // 각 파일을 서버로 전송
                    }
                }
            }
        });

        function uploadFile(file, el) {
            var data = new FormData();
            data.append("file", file);

            $.ajax({
                data: data,
                type: "POST",
                url: '/api/images',
                cache: false,
                contentType: false,
                processData: false,
                enctype: 'multipart/form-data',
                success: function(url) {
                    // 서버에서 반환된 URL을 그대로 사용
                    $(el).summernote('insertImage', url, function ($image) {
/*                        $image.css('width', "100%");*/
                    });
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        alert('로그인이 필요합니다. 다시 로그인해주세요.');
                        return;
                    }
                    if (xhr.status === 403) {
                        alert('이미지 업로드 권한이 없습니다.');
                        return;
                    }
                    alert('이미지 업로드에 실패했습니다.');
                }
            });
        }
    </script>

    <button type="submit" class="w-100 btn btn-lg btn-dark">글쓰기</button>

    <p class="mt-5 mb-3 text-muted">©2024 DataPortal</p>

</form>
</div>
</body>


</html>
