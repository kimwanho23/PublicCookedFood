<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" lang="ko">
<head>
    <th:block th:replace="~{fragments/header :: headResources('게시글 작성')}"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script th:src="@{/js/board-editor.js}"></script>
</head>
<body class="app-shell d-flex flex-column">
<header th:replace="~{fragments/header :: siteHeader}"></header>

<main class="page-shell">
    <div class="container" style="max-width: 980px;">
        <section class="hero-panel mb-4">
            <h1 class="h4 mb-2">새 게시글 작성</h1>
            <p class="mb-0 text-white-50">제목, 탭, 본문을 입력해 커뮤니티에 공유하세요.</p>
        </section>

        <section class="section-wrap p-4">
            <form th:action="@{/boards}" th:object="${boardDto}" method="post">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p class="mb-1" th:each="err : ${#fields.globalErrors()}" th:text="${err}">전체 오류 메시지</p>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="제목을 입력하세요" th:errorclass="field-error">
                    <div class="field-error" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="sectionId" class="form-label">게시판 탭</label>
                    <select id="sectionId" th:field="*{sectionId}" class="form-select" th:errorclass="field-error">
                        <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">게시판 탭</option>
                    </select>
                    <div class="field-error" th:errors="*{sectionId}"></div>
                </div>

                <div class="mb-3">
                    <label for="boardEditor" class="form-label">내용</label>
                    <div id="boardEditor"
                         class="board-quill-shell"
                         th:classappend="${#fields.hasErrors('contents')} ? ' board-quill-shell-invalid'"></div>
                    <textarea id="boardContents" th:field="*{contents}" class="d-none"
                              spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
                    <div class="field-error" th:errors="*{contents}"></div>
                    <div class="form-text">멘션은 <code>@닉네임</code> 형태로 입력하면 알림이 전달됩니다.</div>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-outline-secondary js-board-draft-save">임시저장</button>
                        <span class="small text-muted js-board-draft-status" aria-live="polite"></span>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/boards}">취소</a>
                        <button type="submit" class="btn btn-brand">게시글 등록</button>
                    </div>
                </div>
            </form>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!window.PubCookBoardEditor || typeof window.PubCookBoardEditor.init !== 'function') {
                return;
            }
            window.PubCookBoardEditor.init({
                draftStorageKey: 'boardDraft:new',
                formSelector: 'main form',
                restoreConfirmMessage: '임시 저장된 작성 내용이 있습니다. 복원할까요?'
            });
        });
    </script>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
