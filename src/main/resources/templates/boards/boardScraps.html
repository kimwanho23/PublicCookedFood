<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/header :: headResources('내 스크랩 게시글')}"></th:block>
</head>
<body class="app-shell d-flex flex-column">
<header th:replace="~{fragments/header :: siteHeader}"></header>

<main class="page-shell">
    <div class="container">
        <section class="hero-panel hero-panel-board mb-4">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-2">
                <div>
                    <h1 class="h3 mb-2">내 스크랩 게시글</h1>
                    <p class="mb-0 text-white-50">나중에 보려고 저장한 커뮤니티 게시글입니다.</p>
                </div>
                <span class="hero-badge" th:text="|총 ${scrappedBoards != null ? scrappedBoards.size() : 0}개|">총 0개</span>
            </div>
        </section>

        <section class="section-wrap p-4">
            <div class="alert alert-light border" th:if="${scrappedBoards == null or scrappedBoards.isEmpty()}">
                아직 스크랩한 게시글이 없습니다.
            </div>

            <div class="board-feed" th:if="${scrappedBoards != null and !scrappedBoards.isEmpty()}">
                <article class="board-item" th:each="board : ${scrappedBoards}">
                    <a class="board-row" th:href="@{/boards/{id}(id=${board.id})}">
                        <div class="board-row-body">
                            <div class="board-row-top">
                                <span class="badge text-bg-light" th:text="${board.section != null ? board.section.sectionName : '미분류'}">탭</span>
                                <span class="board-date" th:text="${#temporals.format(board.regTime, 'yyyy.MM.dd HH:mm')}">작성일</span>
                            </div>
                            <h2 class="board-row-title">
                                <span th:text="${board.title != null and board.title.length() > 70 ? board.title.substring(0, 70) + '...' : board.title}">게시글 제목</span>
                            </h2>
                            <div class="board-row-meta">
                                <span class="board-meta-pill" th:text="|작성자 ${board.user != null ? board.user.name : '알 수 없음'}|">작성자</span>
                                <span class="board-meta-pill" th:text="|조회 ${board.views != null ? board.views : 0}|">조회</span>
                                <span class="board-meta-pill" th:text="|추천 ${board.likeCount != null ? board.likeCount : 0}|">추천</span>
                                <span class="board-meta-pill" th:text="|댓글 ${board.commentCount != null ? board.commentCount : 0}|">댓글</span>
                            </div>
                        </div>
                    </a>
                </article>
            </div>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/footer :: siteFooter}"></footer>
</body>
</html>
