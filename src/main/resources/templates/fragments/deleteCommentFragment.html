<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Delete Comment Modal</title>
</head>
<body>
<div th:fragment="deleteCommentModal(actionUrl, commentId)">
    <div class="modal fade"
         th:id="'deleteCommentModal' + ${commentId}"
         tabindex="-1"
         th:attr="aria-labelledby='deleteCommentModalLabel' + ${commentId}"
         aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" th:id="'deleteCommentModalLabel' + ${commentId}">댓글 삭제</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">댓글을 삭제하시겠습니까?</div>
                <div class="modal-footer">
                    <form th:action="${actionUrl}" method="post" class="d-flex gap-2 ms-auto">
                        <input type="hidden" name="_method" value="patch">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-soft-danger btn-action-danger">삭제</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
