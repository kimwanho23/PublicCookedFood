<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Footer</title>
</head>
<body>
<footer th:fragment="siteFooter" class="site-footer">
    <div class="container py-4">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
            <div>
                <p class="mb-1 fw-semibold">PubCook</p>
                <p class="mb-0 small text-muted-soft">공공 데이터 기반 레시피와 커뮤니티를 한 곳에서.</p>
            </div>
            <div class="d-flex gap-3 small">
                <a th:href="@{/recipes}">레시피</a>
                <a th:href="@{/boards}">게시판</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/u/{userId}(userId=${#authentication.principal.user.id})}">내 프로필</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/u/profile}">프로필 수정</a>
                <a sec:authorize="isAuthenticated()" th:href="@{/u/settings}">환경설정</a>
                <a sec:authorize="!isAuthenticated()" th:href="@{/u/login}">로그인</a>
            </div>
            <p class="mb-0 small text-muted-soft">© 2026 PubCook</p>
        </div>
    </div>
</footer>
</body>
</html>
