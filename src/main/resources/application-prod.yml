spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false
  sql:
    init:
      mode: never
server:
  servlet:
    session:
      cookie:
        secure: true
app:
  popular:
    recipe:
      score:
        enabled: ${POPULAR_RECIPE_SCORE_ENABLED:true}
      snapshot:
        enabled: ${POPULAR_RECIPE_SNAPSHOT_ENABLED:true}
