spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    show-sql: true
    hibernate:
      ddl-auto: update
  thymeleaf:
    cache: false
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false
  sql:
    init:
      mode: never
server:
  servlet:
    session:
      cookie:
        secure: false
