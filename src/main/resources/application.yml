spring:
  config:
    import: optional:file:.env[.properties]
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  jpa:
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  application:
    name: PublicCookedFood
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  session:
    store-type: ${SESSION_STORE_TYPE:none}
    redis:
      namespace: ${SESSION_REDIS_NAMESPACE:public-cooked-food:session}
  datasource:
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}
    username: ${DB_USERNAME:root}
    url: ${DB_URL:jdbc:mysql://localhost:3306/food?serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            enable: false
          starttls:
            enable: true
            required: true
  security:
    oauth2:
      client:
        registration:
          naver:
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email
            authorization-grant-type: authorization_code
            client-secret: ${NAVER_CLIENT_SECRET:}
            client-id: ${NAVER_CLIENT_ID:}
            client-name: Naver
          google:
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            client-id: ${GOOGLE_CLIENT_ID:}
            scope: profile,email
        provider:
          naver:
            user-name-attribute: response
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            user-info-uri: https://openapi.naver.com/v1/nid/me
            token-uri: https://nid.naver.com/oauth2.0/token
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  servlet:
    session:
      tracking-modes: cookie
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
file:
  dir: ${FILE_DIR:C:/cookboardImageFile/}
app:
  account:
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}
  session:
    cookie:
      name: ${SESSION_COOKIE_NAME:JSESSIONID}
  image:
    processing:
      enabled: ${IMAGE_PROCESSING_ENABLED:true}
      max-width: ${IMAGE_PROCESSING_MAX_WIDTH:1600}
      max-height: ${IMAGE_PROCESSING_MAX_HEIGHT:1600}
      jpeg-quality: ${IMAGE_PROCESSING_JPEG_QUALITY:0.85}
    temp-cleanup:
      enabled: ${IMAGE_TEMP_CLEANUP_ENABLED:true}
      ttl-hours: ${IMAGE_TEMP_CLEANUP_TTL_HOURS:24}
      batch-size: ${IMAGE_TEMP_CLEANUP_BATCH_SIZE:100}
      max-batches-per-run: ${IMAGE_TEMP_CLEANUP_MAX_BATCHES_PER_RUN:20}
      cron: ${IMAGE_TEMP_CLEANUP_CRON:0 0 * * * *}
  notification:
    sse:
      enabled: ${NOTIFICATION_SSE_ENABLED:true}
      heartbeat-interval-ms: ${NOTIFICATION_SSE_HEARTBEAT_MS:25000}
      metrics-log-interval-ms: ${NOTIFICATION_SSE_METRICS_LOG_MS:60000}
  view-counter:
    redis:
      enabled: ${VIEW_COUNTER_REDIS_ENABLED:false}
      flush-enabled: ${VIEW_COUNTER_REDIS_FLUSH_ENABLED:false}
      flush-interval-ms: ${VIEW_COUNTER_REDIS_FLUSH_INTERVAL_MS:2000}
      flush-batch-size: ${VIEW_COUNTER_REDIS_FLUSH_BATCH_SIZE:200}
  popular:
    board:
      snapshot:
        enabled: ${POPULAR_BOARD_SNAPSHOT_ENABLED:false}
        interval-ms: ${POPULAR_BOARD_SNAPSHOT_INTERVAL_MS:300000}
        ttl-minutes: ${POPULAR_BOARD_SNAPSHOT_TTL_MINUTES:15}
        top-n: ${POPULAR_BOARD_SNAPSHOT_TOP_N:200}
    recipe:
      snapshot:
        enabled: ${POPULAR_RECIPE_SNAPSHOT_ENABLED:false}
        interval-ms: ${POPULAR_RECIPE_SNAPSHOT_INTERVAL_MS:300000}
        ttl-minutes: ${POPULAR_RECIPE_SNAPSHOT_TTL_MINUTES:30}
        top-n: ${POPULAR_RECIPE_SNAPSHOT_TOP_N:100}
        fallback-enabled: ${POPULAR_RECIPE_SNAPSHOT_FALLBACK_ENABLED:true}
        slot-bonus: ${POPULAR_RECIPE_SNAPSHOT_SLOT_BONUS:0.05}
        lunch-keywords: ${POPULAR_RECIPE_SNAPSHOT_LUNCH_KEYWORDS:밥,국,찌개,면,볶음,덮밥}
        dinner-keywords: ${POPULAR_RECIPE_SNAPSHOT_DINNER_KEYWORDS:구이,찜,탕,전골,조림,볶음}
      score:
        enabled: ${POPULAR_RECIPE_SCORE_ENABLED:false}
        interval-ms: ${POPULAR_RECIPE_SCORE_INTERVAL_MS:300000}
        batch-size: ${POPULAR_RECIPE_SCORE_BATCH_SIZE:500}
        weight-views: ${POPULAR_RECIPE_SCORE_WEIGHT_VIEWS:1.00}
        weight-likes: ${POPULAR_RECIPE_SCORE_WEIGHT_LIKES:0.00}
        weight-bookmarks: ${POPULAR_RECIPE_SCORE_WEIGHT_BOOKMARKS:1.30}
        freshness-weight: ${POPULAR_RECIPE_SCORE_FRESHNESS_WEIGHT:0.70}
        freshness-lambda: ${POPULAR_RECIPE_SCORE_FRESHNESS_LAMBDA:0.03}
        async:
          core-pool-size: ${POPULAR_RECIPE_SCORE_ASYNC_CORE_POOL_SIZE:1}
          max-pool-size: ${POPULAR_RECIPE_SCORE_ASYNC_MAX_POOL_SIZE:2}
          queue-capacity: ${POPULAR_RECIPE_SCORE_ASYNC_QUEUE_CAPACITY:200}
