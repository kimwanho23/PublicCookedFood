spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
spring.sql.init.mode=never
spring.session.store-type=none

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope[0]=profile
spring.security.oauth2.client.registration.google.scope[1]=email

spring.security.oauth2.client.registration.naver.client-id=test-client-id
spring.security.oauth2.client.registration.naver.client-secret=test-client-secret
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri=http://localhost/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope[0]=name
spring.security.oauth2.client.registration.naver.scope[1]=email
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

file.dir=/tmp/public-cooked-food-test/

app.image.schema-auto-migrate=false
app.image.processing.enabled=true
app.image.processing.max-width=1600
app.image.processing.max-height=1600
app.image.processing.jpeg-quality=0.85
app.image.temp-cleanup.enabled=true
app.image.temp-cleanup.ttl-hours=24
app.image.temp-cleanup.batch-size=100
app.image.temp-cleanup.max-batches-per-run=20
app.image.temp-cleanup.cron=0 0 * * * *

app.notification.sse.enabled=true
app.notification.sse.heartbeat-interval-ms=25000
app.notification.sse.metrics-log-interval-ms=60000
app.view-counter.redis.enabled=false
app.view-counter.redis.flush-enabled=false
app.view-counter.redis.flush-interval-ms=2000
app.view-counter.redis.flush-batch-size=200
app.popular.board.snapshot.enabled=false
app.popular.board.snapshot.interval-ms=300000
app.popular.board.snapshot.ttl-minutes=15
app.popular.board.snapshot.top-n=200
app.popular.recipe.snapshot.enabled=false
app.popular.recipe.snapshot.interval-ms=300000
app.popular.recipe.snapshot.ttl-minutes=30
app.popular.recipe.snapshot.top-n=100
app.popular.recipe.snapshot.fallback-enabled=true
app.popular.recipe.snapshot.slot-bonus=0.05
app.popular.recipe.snapshot.lunch-keywords=밥,국,찌개,면,볶음,덮밥
app.popular.recipe.snapshot.dinner-keywords=구이,찜,탕,전골,조림,볶음
app.popular.recipe.score.enabled=false
app.popular.recipe.score.interval-ms=300000
app.popular.recipe.score.batch-size=500
app.popular.recipe.score.weight-views=1.00
app.popular.recipe.score.weight-likes=0.00
app.popular.recipe.score.weight-bookmarks=1.30
app.popular.recipe.score.freshness-weight=0.70
app.popular.recipe.score.freshness-lambda=0.03
app.popular.recipe.score.async.core-pool-size=1
app.popular.recipe.score.async.max-pool-size=2
app.popular.recipe.score.async.queue-capacity=50
